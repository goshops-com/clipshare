<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Select area</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        background: rgba(0, 0, 0, 0.4);
      }
      body.dragging {
        background: transparent;
      }
      #hint {
        position: fixed;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(17, 24, 39, 0.85);
        color: white;
        font-size: 14px;
        pointer-events: none;
      }
      #selection {
        position: fixed;
        display: none;
        border: 2px solid #6366f1;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      }
      #size {
        position: absolute;
        right: 0;
        bottom: -24px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #6366f1;
        color: white;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="hint">Drag to select the area to record &middot; Esc to cancel</div>
    <div id="selection"><span id="size"></span></div>

    <script>
      const { ipcRenderer } = require('electron');

      const MIN_SIZE = 20;
      const selection = document.getElementById('selection');
      const size = document.getElementById('size');
      let start = null;
      let rect = null;

      function toRect(a, b) {
        return {
          x: Math.min(a.x, b.x),
          y: Math.min(a.y, b.y),
          width: Math.abs(a.x - b.x),
          height: Math.abs(a.y - b.y),
        };
      }

      document.addEventListener('mousedown', (e) => {
        start = { x: e.clientX, y: e.clientY };
        rect = null;
        document.body.classList.add('dragging');
        document.getElementById('hint').style.display = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!start) return;
        rect = toRect(start, { x: e.clientX, y: e.clientY });
        selection.style.display = 'block';
        selection.style.left = `${rect.x}px`;
        selection.style.top = `${rect.y}px`;
        selection.style.width = `${rect.width}px`;
        selection.style.height = `${rect.height}px`;
        size.textContent = `${rect.width} × ${rect.height}`;
      });

      document.addEventListener('mouseup', () => {
        if (!start) return;
        start = null;
        if (rect && rect.width >= MIN_SIZE && rect.height >= MIN_SIZE) {
          ipcRenderer.send('area-selected', rect);
        } else {
          // Too small (or a plain click): reset and let the user try again
          document.body.classList.remove('dragging');
          selection.style.display = 'none';
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') ipcRenderer.send('area-selected', null);
      });
    </script>
  </body>
</html>
